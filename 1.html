<!DOCTYPE html>
<html lang="en">
<head>
    <h1>Hi Everyone</h1>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Simple Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
            text-align: center;
        }

        header {
            background-color: #222;
            color: white;
            padding: 20px;
        }

        main {
            padding: 50px;
        }

        button {
            padding: 10px 20px;
            border: none;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #0056b3;
        }

        footer {
            margin-top: 50px;
            padding: 15px;
            background-color: #222;
            color: white;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to My Website</h1>
    </header>

    <main>
        <h2>Hello World!</h2>
        <p>This is a simple HTML page.</p>

        <button onclick="alert('Hello!')">
            Click Me
        </button>
    </main>

    <footer>
        <p>© 2026 My Website</p>
    </footer>

</body>
</html>
